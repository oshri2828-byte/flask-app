name: Docker CI (build -> test -> push)

on:
  push:
    branches: ["main"]


permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: flask-app
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Save image to tar
        run: docker save ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar
          retention-days: 1

  test:
    name: Test image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run container
        run: |
          docker run -d --name app -p 5000:5000 \
            ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Basic health check
        run: |
          sleep 3
          curl_output=$(curl -f http://localhost:5000/)
          echo "Curl output: $curl_output"
          if [[ "$curl_output" != *"Hello from Flask app"* ]]; then
            echo "Health check failed!"
            docker logs app
            exit 1
          fi
          

      - name: Cleanup container
        if: always()
        run: docker rm -f app || true

  push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: Load image
        run: docker load -i image.tar


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Tag image for GHCR
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Push to GHCR
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
